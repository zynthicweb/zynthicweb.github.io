<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" width="320" height="68">
  <defs>
    <linearGradient id="zynthic-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A43"/>
      <stop offset="100%" stop-color="#EF3B24"/>
    </linearGradient>
    <linearGradient id="zynthic-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2125"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (Enlarged Stylized Geometric 'Z' Emblem) -->
  <g transform="translate(6, 8)">
    <!-- Outer Accent Frame Box -->
    <rect x="2" y="2" width="52" height="52" rx="12" fill="url(#zynthic-dark-grad)" stroke="url(#zynthic-red-grad)" stroke-width="2.5"/>
    
    <!-- Red L-corner Accent Lines -->
    <path d="M 2,18 L 2,6 C 2,3.8 3.8,2 6,2 L 18,2" fill="none" stroke="#EF3B24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 54,38 L 54,50 C 54,52.2 52.2,54 50,54 L 38,54" fill="none" stroke="#EF3B24" stroke-width="3.5" stroke-linecap="round"/>

    <!-- High-tech Z Emblem -->
    <path d="M 16,17 L 40,17 L 22,39 L 40,39" fill="none" stroke="url(#zynthic-red-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="17" r="3" fill="#FFFFFF"/>
    <circle cx="16" cy="39" r="3" fill="#EF3B24"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 32)">
    <!-- Brand Title "Zynthic" (Enlarged Bolder Font) -->
    <text x="0" y="-3" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#111315" letter-spacing="-0.03em">Zynthic</text>
    <!-- Crimson Red Dot -->
    <circle cx="122" cy="-8" r="4.5" fill="#EF3B24"/>
    
    <!-- Subtle accent line separator giving generous space -->
    <line x1="0" y1="7" x2="168" y2="7" stroke="#EF3B24" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

    <!-- Subtitle "WEB SOLUTIONS" (Enlarged & Spaced) -->
    <text x="0" y="23" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#EF3B24" letter-spacing="0.22em">WEB SOLUTIONS</text>
  </g>
</svg>
